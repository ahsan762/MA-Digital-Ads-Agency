<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — MA Digital Ads Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-gray-950 text-white font-[Inter,sans-serif] min-h-screen">

    <!-- Login Page -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <img src="../logo.png" alt="MA Digital Logo" class="h-16 w-auto mx-auto mb-4 object-contain rounded-2xl">
                <h1 class="text-2xl font-bold">Admin Panel</h1>
                <p class="text-gray-500 text-sm mt-1">MA Digital Ads Agency</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Username</label>
                    <input type="text" id="loginUser" class="admin-input" placeholder="Enter username" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                    <input type="password" id="loginPass" class="admin-input" placeholder="Enter password" required>
                </div>
                <div id="loginError" class="text-red-400 text-sm hidden">Invalid credentials. Try again.</div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-500 rounded-xl font-semibold hover:opacity-90 transition-opacity">
                    Sign In
                </button>
            </form>
            <a href="../index.html" class="block text-center text-sm text-gray-500 hover:text-gray-300 mt-6 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Website
            </a>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <!-- Top Bar -->
        <div class="fixed top-0 left-0 right-0 h-16 bg-gray-950/80 backdrop-blur-xl border-b border-white/5 z-50 flex items-center justify-between px-6">
            <div class="flex items-center gap-3">
                <button id="sidebarToggle" class="lg:hidden text-xl text-gray-400"><i class="fa-solid fa-bars"></i></button>
                <img src="../logo.png" alt="MA Digital Logo" class="h-8 w-auto rounded-lg object-contain">
                <span class="font-semibold text-sm">Admin Panel</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="../index.html" target="_blank" class="text-sm text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-external-link mr-1"></i> View Site
                </a>
                <button id="logoutBtn" class="text-sm text-red-400 hover:text-red-300 transition-colors">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </div>

        <div class="flex pt-16">
            <!-- Sidebar -->
            <aside id="sidebar" class="fixed left-0 top-16 bottom-0 w-64 bg-gray-900/50 border-r border-white/5 p-4 overflow-y-auto transform -translate-x-full lg:translate-x-0 transition-transform z-40">
                <nav class="space-y-1">
                    <button class="admin-nav-btn active" data-tab="projects">
                        <i class="fa-solid fa-folder-open w-5"></i> Projects
                    </button>
                    <button class="admin-nav-btn" data-tab="testimonials">
                        <i class="fa-solid fa-star w-5"></i> Testimonials
                    </button>
                    <button class="admin-nav-btn" data-tab="services">
                        <i class="fa-solid fa-gear w-5"></i> Services
                    </button>
                    <button class="admin-nav-btn" data-tab="hero">
                        <i class="fa-solid fa-pen-fancy w-5"></i> Hero Text
                    </button>
                    <button class="admin-nav-btn" data-tab="settings">
                        <i class="fa-solid fa-sliders w-5"></i> Site Settings
                    </button>
                </nav>
            </aside>

            <!-- Sidebar Overlay -->
            <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

            <!-- Main Content -->
            <main class="flex-1 lg:ml-64 p-6 min-h-[calc(100vh-4rem)]">

                <!-- Projects Tab -->
                <div id="tab-projects" class="admin-tab active">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold">Manage Projects</h2>
                        <button class="admin-add-btn" onclick="openModal('project')">
                            <i class="fa-solid fa-plus mr-2"></i> Add Project
                        </button>
                    </div>
                    <div id="projectsList" class="space-y-3"></div>
                </div>

                <!-- Testimonials Tab -->
                <div id="tab-testimonials" class="admin-tab">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold">Manage Testimonials</h2>
                        <button class="admin-add-btn" onclick="openModal('testimonial')">
                            <i class="fa-solid fa-plus mr-2"></i> Add Testimonial
                        </button>
                    </div>
                    <div id="testimonialsList" class="space-y-3"></div>
                </div>

                <!-- Services Tab -->
                <div id="tab-services" class="admin-tab">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold">Manage Services</h2>
                        <button class="admin-add-btn" onclick="openModal('service')">
                            <i class="fa-solid fa-plus mr-2"></i> Add Service
                        </button>
                    </div>
                    <div id="servicesList" class="space-y-3"></div>
                </div>

                <!-- Hero Tab -->
                <div id="tab-hero" class="admin-tab">
                    <h2 class="text-xl font-bold mb-6">Edit Hero Section</h2>
                    <form id="heroForm" class="admin-form-card space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Headline</label>
                            <input type="text" id="heroHeadline" class="admin-input" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Subheading</label>
                            <input type="text" id="heroSubheading" class="admin-input" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Description</label>
                            <textarea id="heroDescription" class="admin-input" rows="3" required></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Hero Image URL or Filename</label>
                            <input type="text" id="heroImageInput" class="admin-input" placeholder="e.g. banner.png or a Google Image URL" required>
                            <p class="text-xs text-gray-600 mt-1">Provide a web image URL or a filename placed in /images/ folder</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1.5">CTA Button 1</label>
                                <input type="text" id="heroCta1" class="admin-input" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1.5">CTA Button 2</label>
                                <input type="text" id="heroCta2" class="admin-input" required>
                            </div>
                        </div>
                        <button type="submit" class="admin-save-btn">
                            <i class="fa-solid fa-save mr-2"></i> Save Hero Text
                        </button>
                    </form>
                </div>

                <!-- Settings Tab -->
                <div id="tab-settings" class="admin-tab">
                    <h2 class="text-xl font-bold mb-6">Site Settings</h2>
                    <form id="settingsForm" class="admin-form-card space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Logo Text</label>
                            <input type="text" id="setLogo" class="admin-input" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                            <input type="email" id="setEmail" class="admin-input" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Phone</label>
                            <input type="text" id="setPhone" class="admin-input" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Location</label>
                            <input type="text" id="setLocation" class="admin-input" required>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1.5">Facebook URL</label>
                                <input type="url" id="setFacebook" class="admin-input">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1.5">LinkedIn URL</label>
                                <input type="url" id="setLinkedin" class="admin-input">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1.5">WhatsApp URL</label>
                                <input type="url" id="setWhatsapp" class="admin-input">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1.5">Instagram URL</label>
                                <input type="url" id="setInstagram" class="admin-input">
                            </div>
                        </div>
                        <button type="submit" class="admin-save-btn">
                            <i class="fa-solid fa-save mr-2"></i> Save Settings
                        </button>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4" style="display:none;">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-gray-900 border border-white/10 rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h3 id="modalTitle" class="text-lg font-bold"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="modalForm" class="space-y-4">
                <div id="modalFields"></div>
                <input type="hidden" id="modalType">
                <input type="hidden" id="modalEditIndex" value="-1">
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 border border-white/10 rounded-xl font-semibold text-sm hover:bg-white/5 transition-colors">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-blue-500 to-purple-500 rounded-xl font-semibold text-sm hover:opacity-90 transition-opacity">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="adminToast" class="fixed top-20 right-6 z-[70] bg-gray-800 border border-green-500/30 px-5 py-3 rounded-xl flex items-center gap-3 transform translate-x-[120%] transition-transform duration-500">
        <i class="fa-solid fa-check-circle text-green-400"></i>
        <span id="adminToastMsg" class="text-sm"></span>
    </div>

    <script src="admin.js"></script>
</body>
</html>
